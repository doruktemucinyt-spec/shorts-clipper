<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ters logo: sari zemin, koyu cubuklar. Oranlar sayfadaki uc cubuk
       isaretle birebir ayni.

       Cubuklar sitedeki cam yuzeylerle ayni tarifle isleniyor:
       - govde ustten alta hafif acilan bir gradient (duz siyah degil)
       - sol ust kenarda parlama, karsi kenarda daha sonugu
       - ustten asagi inen ve kaybolan bir isik
       - zemine dusen sicak, yumusak golge (sari uzerinde gri golge olu durur) -->
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd400"/>
      <stop offset="1" stop-color="#ff9d00"/>
    </linearGradient>

    <linearGradient id="govde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c23"/>
      <stop offset="1" stop-color="#0a0a0e"/>
    </linearGradient>

    <linearGradient id="kenar" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.22" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="isik" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="golge" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="16"
                    flood-color="#5c2c00" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#zemin)"/>

  <!-- govde + golge -->
  <g fill="url(#govde)" filter="url(#golge)">
    <rect x="102.5" y="258.7" width="74" height="137.6" rx="27.5"/>
    <rect x="218.9" y="115.7" width="74" height="280.6" rx="27.5"/>
    <rect x="335.3" y="211.0" width="74" height="185.3" rx="27.5"/>
  </g>

  <!-- ustten inen isik -->
  <g fill="url(#isik)">
    <rect x="102.5" y="258.7" width="74" height="137.6" rx="27.5"/>
    <rect x="218.9" y="115.7" width="74" height="280.6" rx="27.5"/>
    <rect x="335.3" y="211.0" width="74" height="185.3" rx="27.5"/>
  </g>

  <!-- kenar parlamasi (cizgi iceride kalsin diye yarim kalinlik kadar icerlek) -->
  <g fill="none" stroke="url(#kenar)" stroke-width="2">
    <rect x="103.5" y="259.7" width="72" height="135.6" rx="26.5"/>
    <rect x="219.9" y="116.7" width="72" height="278.6" rx="26.5"/>
    <rect x="336.3" y="212.0" width="72" height="183.3" rx="26.5"/>
  </g>
</svg>
