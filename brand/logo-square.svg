<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ters logo: yesil zeminde yonca sekli KESILMIS. Yani koyu alan bir cisim
       degil, delik. Bu yuzden:
       - zemine golge dusurmuyor (delik golge dusurmez),
       - isik sol ustten geldigi icin delegin KARSI duvari, yani sag alt ic
         kenari isik aliyor; ustteki kenar karanlikta kaliyor.
       Govdedeki hafif gradient de deligin icindeki derinlik hissi. -->
  <defs>
    <path id="leaf" d="M0 0
             C -7 -26, -40 -34, -40 -64
             C -40 -88, -16 -97, 0 -80
             C 16 -97, 40 -88, 40 -64
             C 40 -34, 7 -26, 0 0 Z"/>

    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77e84f"/>
      <stop offset="1" stop-color="#3cbb2e"/>
    </linearGradient>

    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c23"/>
      <stop offset="1" stop-color="#0a0a0e"/>
    </linearGradient>

    <linearGradient id="edge" x1="1" y1="1" x2="0.2" y2="0">
      <stop offset="0" stop-color="#d6ffb0" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#a9f277" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <rect width="512" height="512" fill="url(#ground)"/>

  <g transform="rotate(-20 256 256)">
    <path d="M256 246 C 266 306, 262 340, 292 376" fill="none" stroke="#0a0a0e" stroke-width="16" stroke-linecap="round"/>
    <g transform="translate(256 238) rotate(45) scale(1.55)" fill="url(#body)">
      <use href="#leaf"/>
      <use href="#leaf" transform="rotate(90)"/>
      <use href="#leaf" transform="rotate(180)"/>
      <use href="#leaf" transform="rotate(270)"/>
    </g>
  </g>

  <g transform="rotate(-20 256 256) translate(256 238) rotate(45) scale(1.55)"
     fill="none" stroke="url(#edge)" stroke-width="2.4">
    <use href="#leaf"/>
    <use href="#leaf" transform="rotate(90)"/>
    <use href="#leaf" transform="rotate(180)"/>
    <use href="#leaf" transform="rotate(270)"/>
  </g>
</svg>
