  </defs>
  <g fill="url(#bar)">
    <rect x="1.5"  y="16.5" width="7" height="13"   rx="2.6"/>
    <rect x="12.5" y="3"    width="7" height="26.5" rx="2.6"/>
    <rect x="23.5" y="12"   width="7" height="17.5" rx="2.6"/>
