        <button role="menuitem" data-lang="tr"><svg class="flag" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" fill="#E30A17"/><circle cx="10.5" cy="12" r="6.3" fill="#fff"/><circle cx="12.5" cy="12" r="5.1" fill="#E30A17"/><polygon fill="#fff" points="20.9,12 18.6,12.8 18.55,15.23 17.08,13.29 14.75,14 16.14,12 14.75,10 17.08,10.71 18.55,8.77 18.6,11.2"/></svg><span>Türkçe</span></button>
        <button role="menuitem" data-lang="en"><svg class="flag" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" fill="#012169"/><path d="M0 0 24 24M24 0 0 24" stroke="#fff" stroke-width="5"/><path d="M0 0 24 24M24 0 0 24" stroke="#C8102E" stroke-width="2.8"/><path d="M12 0v24M0 12h24" stroke="#fff" stroke-width="8"/><path d="M12 0v24M0 12h24" stroke="#C8102E" stroke-width="4.8"/></svg><span>English</span></button>
        <button role="menuitem" data-lang="de"><svg class="flag" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="8" fill="#000"/><rect y="8" width="24" height="8" fill="#DD0000"/><rect y="16" width="24" height="8" fill="#FFCE00"/></svg><span>Deutsch</span></button>
        <button role="menuitem" data-lang="fr"><svg class="flag" viewBox="0 0 24 24" aria-hidden="true"><rect width="8" height="24" fill="#002395"/><rect x="8" width="8" height="24" fill="#fff"/><rect x="16" width="8" height="24" fill="#ED2939"/></svg><span>Français</span></button>
      </div>
      </div>
    </div>
  </header>

  <!-- Kurulum: uc dikey adim, soldan saga. Eskiden bunlar alt alta iki ayri
       karttı (kur / baglan); tek kartta birlestirildi ki kullanici kac adim
       kaldigini tek bakista gorsun. Sira degismiyor: once kur, sonra baglan,
       sonra kullan. Yardimcinin kendi adresinden acildiginda (localhost) kart
       hic gorunmuyor -- oraya gelebilen zaten kurmus demektir. -->
  <section class="card setup hidden" id="setup">
    <span class="tag" data-i18n="setup.tag"></span>
    <h2 class="doc-title" data-i18n="setup.title"></h2>
    <p class="doc-lead" data-i18n="setup.lead"></p>

    <ol class="steps">
      <li class="step" id="step-install">
        <span class="step-no">01</span>
        <h3 class="step-title" data-i18n="install.title"></h3>
        <p class="step-text" data-i18n="install.text"></p>
        <div class="step-do">
          <a class="primary" id="install-btn" data-i18n="install.btn"></a>
          <p class="hint" data-i18n="install.steps"></p>
        </div>
      </li>

      <li class="step" id="step-connect">
        <span class="step-no">02</span>
        <h3 class="step-title" id="connect-title"></h3>
        <p class="step-text" id="connect-text"></p>
        <div class="step-do">
          <button id="connect-btn" class="primary"></button>
          <a class="ghost" href="/faq" data-i18n="connect.help"></a>
        </div>
      </li>

      <li class="step" id="step-enjoy">
        <span class="step-no">03</span>
        <h3 class="step-title" data-i18n="enjoy.title"></h3>
        <p class="step-text" data-i18n="enjoy.text"></p>
        <div class="step-do">
          <p class="hint" data-i18n="enjoy.hint"></p>
        </div>
      </li>
    </ol>
  </section>

  <section class="card">
    <span class="tag" data-i18n="tag.source"></span>

    <label for="url" data-i18n="label.url"></label>
    <input id="url" type="url" data-i18n-placeholder="ph.url" autocomplete="off">

    <label for="minutes" data-i18n="label.minutes"></label>
    <input id="minutes" type="number" min="1" max="15" step="0.5" value="4">
    <p class="hint" data-i18n="hint.minutes"></p>

    <label for="zoom" data-i18n="label.zoom"></label>
    <input id="zoom" type="range" min="100" max="250" step="5" value="140">
    <p class="hint" id="zoom-hint"></p>

    <div class="check">
      <input id="captions" type="checkbox">
      <label for="captions" data-i18n="check.captions"></label>
    </div>

    <!-- Aynalama. Altyazi bilerek etkilenmiyor: cevirme overlay'den once
         yapiliyor, yazi sonra basiliyor (bkz. pipeline/render.py). -->
    <div class="check">
      <input id="mirror" type="checkbox">
      <label for="mirror" data-i18n="check.mirror"></label>
    </div>
    <p class="hint" data-i18n="hint.mirror"></p>

    <p class="hint hidden" id="light-note" data-i18n="hint.lightMode"></p>

    <div id="caption-opts" class="row two hidden">
      <div>
        <label for="highlight" data-i18n="label.highlight"></label>
        <input id="highlight" type="color" value="#77E84F">
      </div>
      <div>
        <label for="model" data-i18n="label.model"></label>
        <select id="model">
          <option value="small" data-i18n="opt.small"></option>
          <option value="medium" disabled data-i18n="opt.medium"></option>
          <option value="large-v3" disabled data-i18n="opt.large"></option>
        </select>
      </div>
    </div>

    <div class="preview">
      <div class="shot" id="preview-shot">
        <img id="preview-img" alt="" hidden>
        <div class="shot-empty" id="preview-empty"><span>9:16</span></div>
      </div>
      <div class="preview-side">
        <span class="tag" data-i18n="tag.preview"></span>
        <p class="hint" id="preview-msg"></p>
        <label for="preview-at" data-i18n="label.moment"></label>
        <input id="preview-at" type="range" min="0" max="95" step="1" value="25">
        <button id="preview-btn" class="ghost" data-i18n="btn.preview"></button>
      </div>
    </div>

    <button id="start" class="primary"></button>
  </section>

  <section class="card hidden" id="progress-card">
    <span class="tag" data-i18n="tag.process"></span>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p class="status" id="status"></p>
    <p class="meta" id="meta"></p>
    <button id="reveal" class="ghost hidden" data-i18n="btn.reveal"></button>
    <div id="parts" class="parts"></div>
  </section>

  <section class="card">
    <div class="head">
      <h2 data-i18n="h2.history"></h2>
      <div class="actions">
        <button id="export" class="ghost" data-i18n="btn.export"></button>
        <button id="import-btn" class="ghost" data-i18n="btn.import"></button>
        <input id="import" type="file" accept="application/json" hidden>
      </div>
    </div>
    <div id="history" class="history"></div>
  </section>

  <!-- TikTok. Anahtar tanimli degilse (work/tiktok-config.json yoksa) bu kart
       hic gorunmuyor -- aciklamasi tiktok.py'nin basinda. -->
  <section class="card hidden" id="tiktok-card">
    <div class="head">
      <h2 data-i18n="h2.tiktok"></h2>
      <div class="actions">
        <button id="tiktok-connect" class="ghost" data-i18n="btn.tiktokConnect"></button>
        <button id="tiktok-disconnect" class="ghost hidden" data-i18n="btn.tiktokDisconnect"></button>
      </div>
    </div>
    <p class="hint" id="tiktok-state"></p>
    <p class="hint" data-i18n="tiktok.note"></p>
  </section>

  <section class="card">
    <div class="head">
      <h2 data-i18n="h2.temp"></h2>
      <div class="actions">
        <button id="clear-work" class="ghost" data-i18n="btn.clear"></button>
      </div>
    </div>
    <p class="hint" id="work-size"></p>
  </section>
  <footer class="foot">
    <a href="/faq" data-i18n="foot.faq"></a>
    <span class="sep">/</span>
    <a href="/cookies" data-i18n="foot.cookies"></a>
    <span class="sep">/</span>
    <a href="/privacy" data-i18n="foot.privacy"></a>
    <span class="sep">/</span>
    <a href="/terms" data-i18n="foot.terms"></a>
    <span class="sep">/</span>
    <a id="foot-source" data-i18n="foot.source"></a>
    <span class="sep">/</span>
    <a id="foot-discord" data-i18n="foot.discord"></a>
    <span class="sep">/</span>
    <span data-i18n="foot.note"></span>
  </footer>
</main>


</body>
</html>
